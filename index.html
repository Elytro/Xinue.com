
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传图片 - 免费图片托管</title>
    <link href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: #fff;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        .hero-section {
            text-align: center;
            max-width: 600px;
        }
        .hero-section h1 {
            font-size: 48px;
            font-weight: 300;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .hero-section p {
            font-size: 18px;
            color: #999;
            font-weight: 300;
            margin-bottom: 50px;
            line-height: 1.8;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 16px 60px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        .btn-login:hover::before {
            left: 100%;
        }
        .btn-login:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.3);
        }
        .btn-login:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 13px;
            font-weight: 300;
        }
        .footer a {
            color: #999;
            text-decoration: none;
        }
        .footer a:hover {
            color: #667eea;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: #333;
            margin: 0 auto 30px;
        }
        .notice-bar {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 8px;
            padding: 12px 20px;
            margin-top: 40px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }
        .notice-content {
            display: flex;
            align-items: center;
            white-space: nowrap;
            animation: scrollNotice 15s linear infinite;
        }
        .notice-content:hover {
            animation-play-state: paused;
        }
        .notice-icon {
            font-size: 16px;
            margin-right: 10px;
        }
        .notice-text {
            color: #667eea;
            font-size: 14px;
            font-weight: 500;
        }
        @keyframes scrollNotice {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
        .chatbot-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .chatbot-modal.active {
            display: flex;
        }
        .chatbot-content {
            background: #fff;
            width: 90%;
            max-width: 650px;
            height: 80vh;
            max-height: 700px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            animation: modalSlideIn 0.3s ease-out;
        }
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .chatbot-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chatbot-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .chatbot-iframe {
            flex: 1;
            width: 100%;
            border: none;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 36px;
            }
            .hero-section p {
                font-size: 16px;
            }
            .btn-login {
                padding: 12px 40px;
                font-size: 15px;
            }
            .chatbot-content {
                width: 95%;
                height: 85vh;
            }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="hero-section">
            <h1>贴图库</h1>
            <div class="divider"></div>
            <p>专注于为您提供专业、高效、可靠的图片外链和存储方案</p>
            <a href="#" id="startBtn" class="btn btn-login"> 开 始 探 索 </a>

            <!-- 滚动公告栏 -->
            <div class="notice-bar">
                <div class="notice-content">
                    <span class="notice-text">友情提示：本站的Api接口全栈托管于微信开放平台，包括内容检测，图片鉴黄，违法违规检查等，所有服务均由微信公众平台提供服务！</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 聊天机器人模态框 -->
    <div class="chatbot-modal" id="chatbotModal">
        <div class="chatbot-content">
            <iframe
                class="chatbot-iframe"
                src="https://chatbot.weixin.qq.com/webapp/BhvTR80a9U2GFfKizIeG7QLi5nrxJt?isFloat=false&robotName=%E4%B8%8A%E4%BC%A0%E5%9B%BE%E7%89%87%20-%20%E5%85%8D%E8%B4%B9%E5%9B%BE%E7%89%87%E6%89%98%E7%AE%A1"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2025 <a href="">校内网</a> & <a href="">百度图床</a> & <a href="">梦颖网络</a>. 版权所有.</p>
        <p><a href="//beian.miit.gov.cn">鲁ICP备2025189343号-5</a> · <a href="">鲁公网安备37131202371948号</a></p>
    </footer>

    <script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://apps.bdimg.com/libs/bootstrap/3.3.4/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            // 点击"开始探索"按钮打开模态框
            $('#startBtn').on('click', function(e) {
                e.preventDefault();
                $('#chatbotModal').addClass('active');
                $('body').css('overflow', 'hidden'); // 防止背景滚动
            });


            // 点击模态框外部关闭
            $('#chatbotModal').on('click', function(e) {
                if (e.target === this) {
                    $(this).removeClass('active');
                    $('body').css('overflow', '');
                }
            });

            // 按ESC键关闭模态框
            $(document).on('keydown', function(e) {
                if (e.key === 'Escape' && $('#chatbotModal').hasClass('active')) {
                    $('#chatbotModal').removeClass('active');
                    $('body').css('overflow', '');
                }
            });
        });
    </script>
</body>
</html>
